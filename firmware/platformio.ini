; PlatformIO Project Configuration File
;
; FidoLock - Physical Access Control System
; Based on ESP32 and FIDO2 authentication via YubiKey
;

[platformio]
default_envs = esp32dev
src_dir = src
test_dir = test

[env]
; Common settings - platform-specific settings go in each environment
monitor_speed = 115200
check_tool = cppcheck
check_flags =
    cppcheck: --enable=all --std=c++11 --suppress=preprocessorErrorDirective
check_skip_packages = yes

; Base ESP32 settings (shared by ESP32 variants)
; LOG_LEVEL is read from the shell environment (default 3 = INFO set in Makefile).
; Override: LOG_LEVEL=4 make flash-monitor
[esp32_base]
; Pinned: an unpinned platform resolves to the latest release, and
; espressif32 >= 7 ships Arduino core 3.x (ESP-IDF 5), which removes the
; ledcSetup/ledcAttachPin API this firmware uses. 6.12.0 = Arduino core 2.0.17.
platform = espressif32@6.12.0
; Exact core and toolchain used for development and hardware testing, so CI
; builds the same binary regardless of what the platform resolves to.
platform_packages =
    platformio/framework-arduinoespressif32@3.20017.241212
    espressif/toolchain-xtensa-esp32@8.4.0+2021r2-patch5
framework = arduino
monitor_filters = colorize, esp32_exception_decoder
build_flags =
    -DCORE_DEBUG_LEVEL=${sysenv.LOG_LEVEL}
    -DDEBUG_NFC=${sysenv.DEBUG_NFC}
    -DPERFORMANCE_MONITOR=${sysenv.PERFORMANCE_MONITOR}
    -DCONFIG_LITTLEFS_FOR_IDF_3_2
    -Wall
    -Wextra

; ============================================
; Main ESP32 Development Board
; ============================================
[env:esp32dev]
extends = esp32_base
board = esp32dev
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
lib_deps =
    adafruit/Adafruit PN532@1.3.4
    adafruit/Adafruit BusIO@1.17.4
    bblanchon/ArduinoJson@7.4.2
    Wire
lib_extra_dirs = lib
upload_speed = 921600
test_ignore = *  ; Unit tests run on native, not on hardware

; ============================================
; ESP32-S3 with USB Host support
; ============================================
[env:esp32-s3]
extends = esp32_base
board = esp32-s3-devkitc-1
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
lib_deps =
    adafruit/Adafruit PN532@1.3.4
    adafruit/Adafruit BusIO@1.17.4
    bblanchon/ArduinoJson@7.4.2
    Wire
lib_extra_dirs = lib
build_flags =
    ${esp32_base.build_flags}
    -DBOARD_HAS_USB_HOST
test_ignore = *  ; Unit tests run on native, not on hardware

; ============================================
; Native Test Environment (for CI)
; ============================================
[env:native]
platform = native
build_flags =
    -std=c++17
    -DUNIT_TEST
    ; No Arduino stand-ins are needed on host: hardware access sits behind
    ; ports (ports/out/) and utils/log.h dispatches logging per platform, so
    ; any stray Arduino dependency in host-built code is a compile error.
    ; mbedTLS 3.x for the crypto adapter integration test. The device runs
    ; ESP-IDF v4.4.7's mbedTLS 2.28.7: crypto_engine compiles against both,
    ; but the test helpers use 3.x-only APIs. Linux CI builds 3.6 LTS from
    ; source (Ubuntu's libmbedtls-dev is 2.28) and exposes it via
    ; CPATH/LIBRARY_PATH; the Homebrew keg-only mbedtls@3 paths below are
    ; harmless no-ops when absent. MBEDTLS_ALLOW_PRIVATE_ACCESS exposes the
    ; mbedtls_ecp_keypair internals (grp/Q) that crypto_engine accesses
    ; directly; on 2.28 those fields are public.
    -DMBEDTLS_ALLOW_PRIVATE_ACCESS
    -I/opt/homebrew/opt/mbedtls@3/include
    -L/opt/homebrew/opt/mbedtls@3/lib
    -lmbedcrypto
test_framework = googletest
test_build_src = yes
; Build only the source files needed for unit tests.
; CredentialStore (LittleFS) and NFCReader are integration-tested on device.
build_src_filter =
    -<*>
    +<application/access/access_controller.cpp>
    +<application/ctap2/ctap2_handler.cpp>
    +<adapters/crypto/crypto_engine.cpp>
    +<adapters/serial/serial_commands.cpp>
    +<application/orchestrator/fidolock_orchestrator.cpp>
    +<domain/>
    +<ports/>
; Ignore test_hal (shared headers only) and test_mocks (shared headers only)
test_ignore =
    test_hal
    test_mocks
lib_deps =
    bblanchon/ArduinoJson@7.4.2
