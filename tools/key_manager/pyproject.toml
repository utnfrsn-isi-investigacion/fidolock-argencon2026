[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "key_manager"
version = "0.1.0"
description = "FidoLock CLI – register and manage FIDO2 credentials on ESP32"
requires-python = ">=3.11"
dependencies = [
    "fido2==1.1.3",
    "pyserial==3.5",
    "click==8.1.7",
]

[project.scripts]
key-manager = "key_manager.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
