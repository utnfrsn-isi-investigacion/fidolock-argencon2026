# FidoLock ARGENCON 2026 artifact CI
# Builds the firmware, runs the native unit tests and checks the Python tools,
# to show that this frozen snapshot still builds and passes its tests.

name: CI

on:
  push:
  workflow_dispatch:

env:
  PLATFORMIO_CORE_VERSION: '6.1.19'
  # mbedTLS 3.6 LTS for the host unit tests, whose helpers need the 3.x API
  # (the device runs ESP-IDF v4.4.7's mbedTLS 2.28.7). Built from source in
  # unit-tests because no Ubuntu LTS apt archive ships a 3.x libmbedtls-dev
  # (noble = 2.28).
  MBEDTLS_VERSION: '3.6.6'

jobs:
  # ============================================
  # Firmware Build
  # ============================================
  build-firmware:
    name: Build Firmware
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: ${{ runner.os }}-pio-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio==${{ env.PLATFORMIO_CORE_VERSION }}

      - name: Build firmware
        working-directory: firmware
        env:
          LOG_LEVEL: 3
          DEBUG_NFC: 0
          PERFORMANCE_MONITOR: 0
        run: pio run

      - name: Check firmware size
        working-directory: firmware
        env:
          LOG_LEVEL: 3
          DEBUG_NFC: 0
          PERFORMANCE_MONITOR: 0
        run: |
          pio run --target size
          SIZE=$(stat -c%s .pio/build/esp32dev/firmware.bin 2>/dev/null || echo "0")
          MAX_SIZE=1310720  # 1.25MB (leaving room for OTA)
          echo "Firmware size: $SIZE bytes"
          if [ "$SIZE" -gt "$MAX_SIZE" ]; then
            echo "::error::Firmware size exceeds limit ($MAX_SIZE bytes)"
            exit 1
          fi

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: firmware-esp32
          path: firmware/.pio/build/esp32dev/firmware.bin
          retention-days: 30

  # ============================================
  # Unit Tests
  # ============================================
  unit-tests:
    name: Unit Tests
    # Pinned (not ubuntu-latest) to keep the host toolchain deterministic
    # regardless of when ubuntu-latest migrates. mbedTLS itself is built from
    # source at env.MBEDTLS_VERSION (no Ubuntu LTS ships a 3.x libmbedtls-dev),
    # so the runner image only supplies the compiler and cmake.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: ${{ runner.os }}-pio-test-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio==${{ env.PLATFORMIO_CORE_VERSION }}

      - name: Cache mbedTLS
        id: cache-mbedtls
        uses: actions/cache@v6
        with:
          path: ~/.local/mbedtls
          key: ${{ runner.os }}-mbedtls-${{ env.MBEDTLS_VERSION }}

      - name: Build mbedTLS (native crypto integration tests)
        if: steps.cache-mbedtls.outputs.cache-hit != 'true'
        run: |
          # The release tarball (not the auto-generated source archive) bundles
          # the framework submodule and pre-generated files, so the build needs
          # no Python and ENABLE_TESTING/PROGRAMS can stay off.
          curl -fsSLO "https://github.com/Mbed-TLS/mbedtls/releases/download/mbedtls-${MBEDTLS_VERSION}/mbedtls-${MBEDTLS_VERSION}.tar.bz2"
          tar xjf "mbedtls-${MBEDTLS_VERSION}.tar.bz2"
          cmake -S "mbedtls-${MBEDTLS_VERSION}" -B mbedtls-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_TESTING=OFF \
            -DENABLE_PROGRAMS=OFF \
            -DCMAKE_INSTALL_PREFIX="$HOME/.local/mbedtls"
          cmake --build mbedtls-build -j"$(nproc)"
          cmake --install mbedtls-build

      - name: Expose mbedTLS to the host toolchain
        run: |
          # GCC picks these up as implicit -I/-L for the PlatformIO native env.
          echo "CPATH=$HOME/.local/mbedtls/include" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$HOME/.local/mbedtls/lib" >> "$GITHUB_ENV"
          # Fail fast if the prefix ever holds a non-3.x mbedTLS, rather than
          # letting the integration test miscompile against an unexpected API.
          MAJOR=$(grep -rhoP 'define\s+MBEDTLS_VERSION_MAJOR\s+\K[0-9]+' \
            "$HOME/.local/mbedtls/include/mbedtls/" | head -1)
          echo "Installed mbedTLS major version: ${MAJOR}"
          if [ "${MAJOR}" != "3" ]; then
            echo "::error::Expected mbedTLS 3.x (ESP-IDF parity); got major '${MAJOR}'"
            exit 1
          fi

      - name: Run unit tests (native)
        working-directory: firmware
        run: pio test -e native --verbose

  # ============================================
  # Python Tools
  # ============================================
  python-tools:
    name: Python Tools Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('tools/key_manager/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        working-directory: tools/key_manager
        run: |
          python -m pip install --upgrade pip
          pip install . flake8

      - name: Lint with flake8
        working-directory: tools/key_manager
        run: |
          # Stop on syntax errors or undefined names
          flake8 key_manager --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warnings (non-blocking)
          flake8 key_manager --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics

      - name: Check syntax
        working-directory: tools/key_manager
        run: |
          python -m py_compile key_manager/__init__.py
          python -m py_compile key_manager/__main__.py
          python -m py_compile key_manager/credentials.py
          python -m py_compile key_manager/registration.py
          python -m py_compile key_manager/serial_comm.py

